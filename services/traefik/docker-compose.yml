name: global-traefik

# Reverse proxy for local web apps: http://<name>.localhost  ->  container on global-net.
# Containers opt in with labels (see README). *.localhost resolves to 127.0.0.1 in browsers, no hosts file needed.
services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=global-net
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --ping=true
      - --log.level=INFO
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    ports:
      - "127.0.0.1:${TRAEFIK_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.localhost`)
      - traefik.http.routers.traefik.entrypoints=web
      - traefik.http.routers.traefik.service=api@internal
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [global-net]

networks:
  global-net:
    external: true
